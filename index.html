<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cryptography Toolkit</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>Cryptography <span>Toolkit</span></h1>
            <p>Secure, fast, and local encryption laboratory.</p>
        </header>

        <main class="glass-panel">
            <div class="form-group">
                <label for="algorithm">Select Algorithm</label>
                <div class="custom-select">
                    <select id="algorithm">
                        <optgroup label="Symmetric">
                            <option value="aes">AES</option>
                            <option value="des">DES</option>
                            <option value="3des">3DES</option>
                        </optgroup>
                        <optgroup label="Asymmetric">
                            <option value="rsa">RSA</option>
                        </optgroup>
                        <optgroup label="Hashing">
                            <option value="sha256">SHA-256</option>
                            <option value="md5">MD5</option>
                        </optgroup>
                    </select>
                </div>
            </div>

            <!-- Symmetric Configuration Panel -->
            <div id="panel-symmetric" class="dynamic-panel form-group-box">
                <div class="form-row">
                    <div class="form-col" style="flex: 1;">
                        <label for="sym-mode">Mode of Operation</label>
                        <select id="sym-mode">
                            <option value="cbc">CBC</option>
                            <option value="ecb">ECB</option>
                        </select>
                    </div>
                    <div class="form-col" style="flex: 2;">
                        <label for="sym-key">Secret Key</label>
                        <div class="input-with-button">
                            <input type="text" id="sym-key" placeholder="Enter or gen key">
                            <button id="btn-gen-sym-key" class="btn btn-secondary btn-small">Generate</button>
                        </div>
                    </div>
                </div>
                <div class="form-group mt-1">
                    <label>Action</label>
                    <div class="radio-group">
                        <label><input type="radio" name="sym-action" value="encrypt" checked> Encrypt</label>
                        <label><input type="radio" name="sym-action" value="decrypt"> Decrypt</label>
                    </div>
                </div>
            </div>

            <!-- Asymmetric Configuration Panel -->
            <div id="panel-asymmetric" class="dynamic-panel form-group-box" style="display: none;">
                <div class="form-group">
                    <button id="btn-gen-rsa" class="btn btn-secondary w-100">Generate RSA Key Pair</button>
                    <div class="key-display mt-1">
                        <div>
                            <label>Public Key</label>
                            <textarea id="rsa-public-key" placeholder="Public Key..." rows="2" readonly></textarea>
                        </div>
                        <div>
                            <label>Private Key</label>
                            <textarea id="rsa-private-key" placeholder="Private Key..." rows="2" readonly></textarea>
                        </div>
                    </div>
                </div>
                <div class="form-group mt-1">
                    <label>Action</label>
                    <div class="radio-group">
                        <label><input type="radio" name="rsa-action" value="encrypt" checked> Encrypt (with Public Key)</label>
                        <label><input type="radio" name="rsa-action" value="decrypt"> Decrypt (with Private Key)</label>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="input">Input Data</label>
                <textarea id="input" placeholder="Enter plaintext or ciphertext to process..."></textarea>
            </div>

            <div class="actions">
                <button id="btn-run" class="btn btn-primary">
                    <span class="btn-text">Execute</span>
                    <span class="btn-icon">⚡</span>
                </button>
                <button id="btn-clear" class="btn btn-secondary">Try Again (Clear)</button>
            </div>

            <div class="result-section">
                <div class="result-header">
                    <label>Result</label>
                    <button id="btn-copy" class="btn-icon-only" title="Copy to clipboard">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                    </button>
                </div>
                <div id="result" class="result-box">No output yet.</div>
            </div>
        </main>

        <footer>
            <p>Lab 1 - Group 11</p>
        </footer>
    </div>

    <!-- Remote Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsencrypt/3.3.2/jsencrypt.min.js"></script>
    
    <!-- Scripts -->
    <script src="des_3des.js"></script>
    <script src="symmetric.js"></script>
    <script src="rsa.js"></script>
    <script src="hash.js"></script>
    <script src="main.js"></script>
</body>
</html>
